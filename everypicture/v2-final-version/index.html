<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's in my bag?</title>

    <!-- normalize CSS-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- styles -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="layout">

    <header class="hero">
        <img class="title" src="images/title.svg" alt="What's in my bag?">
    </header>

    <div class="bag-container">
        <img class="bag" src="images/bag.svg" alt="bag" id="bag">
    </div>

    <div id="end-overlay" class="end-overlay">
        <p>Wow, this bag is heavy!</p>
        <button id="reset-btn">Clean up</button>
    </div>
</main>

</body>
</html>
