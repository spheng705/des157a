<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's in my bag?</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="layout">
        <header class="hero">
            <img class="title" src="images/title.svg" alt="What's in my bag?">
        </header>

        <div class="bag-container">
            <img class="bag" src="images/bag.svg" alt="bag" id="bag">
        </div>

        <div id="end-overlay" class="end-overlay">
            <p class="end-title">Wow, this bag is heavy!</p>
            <p class="end-reflection">Both emotionally and physically. It carries the pieces of my life, from everyday essentials to the things that have shaped who I am.</p>
            <button id="reset-btn">Clean up</button>
        </div>
    </main>

</body>
</html>
